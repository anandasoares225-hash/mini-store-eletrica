<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini Store</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#fffaf0}.header{background:#FFD60A;padding:20px 16px;border-bottom:3px solid #000}.header h1{font-size:26px;font-weight:900}.stats{display:flex;gap:10px;padding:14px;background:#fff;border-bottom:3px solid #000}.stat{flex:1;background:#FFD60A;border:3px solid #000;border-radius:14px;padding:10px;text-align:center;font-weight:800}.stat b{display:block;font-size:20px}.form{padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff;border-bottom:3px solid #000}input,select{border:3px solid #000;border-radius:12px;padding:14px;font-size:15px;font-weight:600;width:100%}.btn{border:3px solid #000;border-radius:12px;padding:14px;font-weight:900;background:#FFD60A}.list{padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:80px}.card{border:3px solid #000;border-radius:14px;padding:14px;background:#fff;display:flex;justify-content:space-between;align-items:center}.badge{border:2px solid #000;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:900}.DISPONIVEL{background:#A8E6CF}.EM.USO{background:#FFE082}.PENDENTE{background:#FFAB91}</style></head><body><div class="header"><h1>⚡ Mini Store - 10 + extras</h1><p>Toque no selo pra mudar • Salva automatico</p></div><div class="stats"><div class="stat"><b id="c1">0</b>Disponível</div><div class="stat"><b id="c2">0</b>Em uso</div><div class="stat"><b id="c3">0</b>Pendente</div></div><div class="form"><input id="nome" placeholder="Ex: Sensor 10A"><select id="status"><option>DISPONIVEL</option><option>EM USO</option><option>PENDENTE</option></select><button class="btn" onclick="add()">+ SALVAR MATERIAL</button></div><div class="list" id="lista"></div><script>let materiais=JSON.parse(localStorage.getItem('mini_store_v2')||'null')||[{nome:'Fusível NH 10A',codigo:'EL-001',status:'DISPONIVEL'},{nome:'Disjuntor DR 63A',codigo:'EL-002',status:'EM USO'},{nome:'Botoeira Verde',codigo:'EL-003',status:'DISPONIVEL'},{nome:'Botoeira Vermelha',codigo:'EL-004',status:'EM USO'},{nome:'Sensor Indutivo',codigo:'EL-005',status:'DISPONIVEL'},{nome:'Relé 24V',codigo:'EL-006',status:'PENDENTE'},{nome:'Contator 25A',codigo:'EL-007',status:'DISPONIVEL'},{nome:'Cabo Flex 2.5mm',codigo:'EL-008',status:'DISPONIVEL'},{nome:'Trilho DIN',codigo:'EL-009',status:'DISPONIVEL'},{nome:'Canaleta 40x40',codigo:'EL-010',status:'EM USO'}];function save(){localStorage.setItem('mini_store_v2',JSON.stringify(materiais))}function render(){let l=document.getElementById('lista');l.innerHTML='';let d=0,u=0,p=0;materiais.forEach((m,i)=>{if(m.status=='DISPONIVEL')d++;else if(m.status=='EM USO')u++;else p++;let cor=m.status.replace(' ','.');l.innerHTML+=`<div class=card><div><b>${m.nome}</b><br><small>${m.codigo}</small></div><span class="badge ${cor}" onclick="toggle(${i})">${m.status}</span></div>`});document.getElementById('c1').innerText=d;document.getElementById('c2').innerText=u;document.getElementById('c3').innerText=p;save()}function toggle(i){let s=materiais[i].status;materiais[i].status=s=='DISPONIVEL'?'EM USO':s=='EM USO'?'PENDENTE':'DISPONIVEL';render()}function add(){let n=document.getElementById('nome').value.trim();let s=document.getElementById('status').value;if(!n)return alert('Digite o nome');let code='EL-'+String(materiais.length+1).padStart(3,'0');materiais.unshift({nome:n,codigo:code,status:s});document.getElementById('nome').value='';render()}render();</script></body></html>
